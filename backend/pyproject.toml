[project]
name = "mygarmin"
version = "0.1.0"
description = "Self-hosted personal Garmin Connect dashboard backed by the official Garmin Personal API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "garmin-fit-sdk>=21.141",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
mygarmin = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 is the idiomatic FastAPI dependency-injection pattern (Depends() in
# argument defaults); PYI034/RUF046 are benign stylistic hints.
ignore = ["B008", "PYI034", "RUF046"]
